name: secret-scan

# Репозиторий публичный: токен бота, уехавший в коммит, за часы находят
# сканеры GitHub и начинают рассылать спам от имени бота. Проверка встаёт
# поперёк такого коммита.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, что в коде нет секретов
        run: bash scripts/check-secrets.sh
